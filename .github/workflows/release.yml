name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build, such as v0.1.1
        required: true
        default: v0.1.1
      release_name:
        description: Display name for the GitHub Release
        required: true
        default: Arr Helper UI v0.1.1
      draft_release:
        description: Create the GitHub Release as a draft
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  APP_OUTPUT_NAME: arr-helper-ui
  TARGET_ARCH: windows-x64

jobs:
  release-metadata:
    name: Resolve Release Metadata
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      draft_release: ${{ steps.resolve.outputs.draft_release }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Resolve release metadata
        id: resolve
        shell: pwsh
        run: |
          $releaseTag = "${{ github.ref_name }}"
          $releaseName = "Arr Helper UI $releaseTag"
          $draftRelease = "false"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              $releaseTag = "${{ inputs.release_tag }}"
              $releaseName = "${{ inputs.release_name }}"
              $draftRelease = "${{ inputs.draft_release }}".ToLowerInvariant()
          }
          if ($releaseTag -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Release tag '$releaseTag' must match vMAJOR.MINOR.PATCH."
          }
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT
          "draft_release=$draftRelease" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Validate release tag matches project version
        shell: pwsh
        run: |
          @'
          from __future__ import annotations

          import sys
          import tomllib
          from pathlib import Path

          release_tag = sys.argv[1]
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = str(pyproject["project"]["version"])
          expected_tag = f"v{version}"
          if release_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {release_tag!r} does not match project version "
                  f"{version!r}; expected {expected_tag!r}."
              )
          '@ | python - "${{ steps.resolve.outputs.release_tag }}"

  build-release-assets:
    name: Build Release Assets
    needs: release-metadata
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Prepare project environment
        run: python scripts/windows/setup_env.py

      - name: Build standalone executable
        run: python scripts/windows/build_nuitka.py

      - name: Package portable release zip
        run: >
          python scripts/windows/package_release.py
          --release-tag "${{ needs.release-metadata.outputs.release_tag }}"
          --target-arch "${{ env.TARGET_ARCH }}"

      - name: Build onefile executable
        run: python scripts/windows/build_onefile.py

      - name: Package onefile executable
        run: >
          python scripts/windows/package_onefile.py
          --release-tag "${{ needs.release-metadata.outputs.release_tag }}"
          --target-arch "${{ env.TARGET_ARCH }}"

      - name: Smoke test onefile executable launch
        run: >
          python scripts/windows/smoke_launch.py
          --exe-path "build/release/${{ env.APP_OUTPUT_NAME }}-${{ needs.release-metadata.outputs.release_tag }}-${{ env.TARGET_ARCH }}.exe"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_OUTPUT_NAME }}-${{ needs.release-metadata.outputs.release_tag }}-${{ env.TARGET_ARCH }}-release-assets
          path: |
            build/release/*.zip
            build/release/*.exe

  publish-release:
    name: Publish GitHub Release
    needs:
      - release-metadata
      - build-release-assets
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.APP_OUTPUT_NAME }}-${{ needs.release-metadata.outputs.release_tag }}-*-release-assets
          path: build/release
          merge-multiple: true

      - name: Write release checksums
        run: python scripts/windows/write_release_checksums.py

      - name: Verify release asset set
        run: >
          python scripts/windows/verify_release_assets.py
          --release-tag "${{ needs.release-metadata.outputs.release_tag }}"
          --target-arch "${{ env.TARGET_ARCH }}"

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ github.workspace }}/build/release/*.zip
            ${{ github.workspace }}/build/release/*.exe
            ${{ github.workspace }}/build/release/SHA256SUMS.txt

      - name: Upload combined release assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_OUTPUT_NAME }}-${{ needs.release-metadata.outputs.release_tag }}-release-assets
          path: |
            build/release/*.zip
            build/release/*.exe
            build/release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-metadata.outputs.release_tag }}
          name: ${{ needs.release-metadata.outputs.release_name }}
          draft: ${{ needs.release-metadata.outputs.draft_release == 'true' }}
          generate_release_notes: true
          files: |
            build/release/*.zip
            build/release/*.exe
            build/release/SHA256SUMS.txt

  verify-published-release:
    name: Verify Published Release
    needs:
      - release-metadata
      - publish-release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Download published release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "build\published-release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          gh release download "${{ needs.release-metadata.outputs.release_tag }}" `
            --repo "$env:GITHUB_REPOSITORY" `
            --dir "$releaseDir" `
            --clobber

      - name: Verify published release checksums
        run: >
          python scripts/windows/verify_release_assets.py
          --release-dir build/published-release
          --release-tag "${{ needs.release-metadata.outputs.release_tag }}"
          --target-arch "${{ env.TARGET_ARCH }}"

      - name: Verify published release attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "build\published-release"
          $assets = Get-ChildItem -LiteralPath $releaseDir -File |
            Where-Object { $_.Name -like "*.exe" -or $_.Name -like "*.zip" -or $_.Name -eq "SHA256SUMS.txt" }
          foreach ($asset in $assets) {
              gh attestation verify "$($asset.FullName)" --repo "$env:GITHUB_REPOSITORY"
          }

      - name: Smoke test published executable launch
        run: >
          python scripts/windows/smoke_launch.py
          --exe-path "build/published-release/${{ env.APP_OUTPUT_NAME }}-${{ needs.release-metadata.outputs.release_tag }}-${{ env.TARGET_ARCH }}.exe"
